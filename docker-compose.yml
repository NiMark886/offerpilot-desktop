name: offerpilot

services:
  backend:
    build:
      context: ./backend
    container_name: offerpilot-backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offerpilot}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_SETTINGS_SECRET: ${AI_SETTINGS_SECRET:-}
      AI_ALLOW_PRIVATE_BASE_URL: ${AI_ALLOW_PRIVATE_BASE_URL:-false}
      AI_BLUEPRINT_TIMEOUT: ${AI_BLUEPRINT_TIMEOUT:-PT25S}
      APP_QUOTA_ENFORCE: ${APP_QUOTA_ENFORCE:-false}
      OFFERPILOT_UPLOAD_DIR: /app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - upload-data:/app/data/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: offerpilot-frontend
    ports:
      - "${OFFERPILOT_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: offerpilot-redis
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: offerpilot-postgres
    profiles: ["infra"]
    environment:
      POSTGRES_DB: offerpilot
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: offerpilot
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: offerpilot-minio
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: offerpilot
      MINIO_ROOT_PASSWORD: offerpilot123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  upload-data:
  redis-data:
  postgres-data:
  minio-data:
