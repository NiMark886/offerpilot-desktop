server:
  address: 127.0.0.1
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    url: jdbc:h2:file:${OFFERPILOT_DATA_DIR:${user.home}/.offerpilot}/data/offerpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:demo-key}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  desktop:
    single-user: true
  cors:
    allowed-origins: null,http://localhost:*,http://127.0.0.1:*
  ai:
    enabled: ${APP_AI_ENABLED:true}
    allow-private-base-url: false
  quota:
    enforce: false
  storage:
    local-root: ${OFFERPILOT_DATA_DIR:${user.home}/.offerpilot}/uploads
